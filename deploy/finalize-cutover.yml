---
- name: Finalize a prepared Codex Gateway cutover on Grace
  hosts: grace
  gather_facts: false
  vars:
    gateway_repo: "{{ playbook_dir | dirname }}"
    gateway_release_root: "{{ gateway_home }}/.local/share/codex-gateway"
    gateway_state_root: "{{ gateway_home }}/.local/state/codex-gateway"
    gateway_catalog_path: "{{ gateway_state_root }}/model-catalog.json"
    gateway_pending_path: "{{ gateway_state_root }}/pending-cutover.json"
    gateway_codex_config: "{{ gateway_home }}/.codex/config.toml"
    gateway_unit_path: /etc/systemd/system/codex-gateway.service
    gateway_app_server_socket: "{{ gateway_home }}/.codex/app-server-control/app-server-control.sock"
    gateway_managed_config_block: |
      # BEGIN CODEX GATEWAY MANAGED
      openai_base_url = "http://127.0.0.1:48766/v1"
      model_providers.chatgpt_gateway = { name = "ChatGPT Gateway", base_url = "http://127.0.0.1:48766/v1", requires_openai_auth = true, supports_websockets = false, wire_api = "responses" }
      model_providers.modal_gateway = { name = "Modal Gateway", base_url = "http://127.0.0.1:48766/v1", requires_openai_auth = true, supports_websockets = false, wire_api = "responses", request_max_retries = 0, stream_max_retries = 0 }
      # END CODEX GATEWAY MANAGED
    gateway_subagent_mode_line: 'multi_agent_v2 = { enabled = false } # Temporary: Modal cannot consume encrypted v2 agent handoffs.'
  tasks:
    - name: Read target identity
      ansible.builtin.command:
        argv: [sh, -c, 'hostname; id -un; uname -m']
      register: gateway_identity
      changed_when: false

    - name: Assert Grace identity and absolute paths
      ansible.builtin.assert:
        that:
          - gateway_identity.stdout_lines == [gateway_expected_hostname, gateway_expected_user, gateway_expected_arch]
          - gateway_home is match('^/home/[^/]+$')
          - gateway_pending_path == gateway_home + '/.local/state/codex-gateway/pending-cutover.json'

    - name: Require a clean committed source tree
      ansible.builtin.command:
        argv: [git, status, --porcelain=v1, --untracked-files=normal]
        chdir: "{{ gateway_repo }}"
      register: gateway_git_status
      changed_when: false

    - name: Read exact source commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ gateway_repo }}"
      register: gateway_commit
      changed_when: false

    - name: Inspect pending cutover
      ansible.builtin.stat:
        path: "{{ gateway_pending_path }}"
      register: gateway_pending_file
      changed_when: false

    - name: Require the prepared cutover
      ansible.builtin.assert:
        that:
          - gateway_git_status.stdout == ''
          - gateway_pending_file.stat.exists
          - gateway_pending_file.stat.isreg
          - gateway_pending_file.stat.mode == '0600'
        fail_msg: No valid prepared cutover is available. Run bin/deploy-grace prepare first.

    - name: Read pending cutover
      ansible.builtin.slurp:
        src: "{{ gateway_pending_path }}"
      register: gateway_pending_raw
      no_log: true

    - name: Decode pending cutover
      ansible.builtin.set_fact:
        gateway_pending: "{{ gateway_pending_raw.content | b64decode | from_json }}"
      no_log: true

    - name: Validate pending cutover identity
      ansible.builtin.assert:
        that:
          - gateway_pending.version == 1
          - gateway_pending.commit == gateway_commit.stdout
          - gateway_pending.host == gateway_expected_hostname
          - gateway_pending.account == gateway_expected_user
          - gateway_pending.transaction_path is match('^' + gateway_state_root + '/transaction-[A-Za-z0-9_]+$')
        fail_msg: The pending cutover does not belong to this exact source commit and Grace account.

    - name: Inspect activated artifacts
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ gateway_release_root }}/current/codex-gateway"
        - "{{ gateway_catalog_path }}"
        - "{{ gateway_codex_config }}"
        - "{{ gateway_unit_path }}"
        - "{{ gateway_pending.transaction_path }}"
      register: gateway_activated_files
      changed_when: false

    - name: Read activated release
      ansible.builtin.command:
        argv: [readlink, "{{ gateway_release_root }}/current"]
      register: gateway_current_release
      changed_when: false

    - name: Require the prepared artifacts to remain active
      ansible.builtin.assert:
        that:
          - gateway_current_release.stdout == gateway_release_root + '/releases/' + gateway_pending.commit
          - gateway_activated_files.results[0].stat.checksum == gateway_pending.binary_sha256
          - gateway_activated_files.results[1].stat.checksum == gateway_pending.catalog_sha256
          - gateway_activated_files.results[3].stat.checksum == gateway_pending.unit_sha256
          - gateway_activated_files.results[4].stat.isdir
        fail_msg: Prepared artifacts changed before finalization; retain the pending transaction and roll back.

    # config.toml is a living Codex document and may record an unrelated model
    # selection during restart. Validate only the settings owned by this rollout.
    - name: Read activated Codex configuration
      ansible.builtin.slurp:
        src: "{{ gateway_codex_config }}"
      register: gateway_codex_config_raw
      no_log: true

    - name: Require the managed Codex settings to remain active
      ansible.builtin.assert:
        that:
          - gateway_managed_config_block in (gateway_codex_config_raw.content | b64decode)
          - gateway_subagent_mode_line in (gateway_codex_config_raw.content | b64decode).splitlines()
        fail_msg: Managed Codex settings changed before finalization; retain the pending transaction and roll back.

    - name: Inspect replacement Codex app server
      ansible.builtin.command:
        argv: ["{{ gateway_codex_binary }}", app-server, daemon, version]
      register: gateway_codex_daemon_version
      changed_when: false

    - name: Inspect replacement Codex app server socket
      ansible.builtin.stat:
        path: "{{ gateway_app_server_socket }}"
      register: gateway_app_server_socket_after
      changed_when: false

    - name: Require an owner-performed app server restart
      ansible.builtin.assert:
        that:
          - (gateway_codex_daemon_version.stdout | from_json).status == 'running'
          - gateway_app_server_socket_after.stat.exists
          - not gateway_pending.app_server_socket_before.exists or gateway_app_server_socket_after.stat.inode != gateway_pending.app_server_socket_before.inode or gateway_app_server_socket_after.stat.mtime != gateway_pending.app_server_socket_before.mtime or gateway_app_server_socket_after.stat.ctime != gateway_pending.app_server_socket_before.ctime
        fail_msg: Grace's app server has not been replaced. Use the owning desktop's Restart action for Grace, then run finalize again.

    - name: Wait for gateway readiness
      ansible.builtin.uri:
        url: http://127.0.0.1:48766/ready
        status_code: 200
        return_content: true
      register: gateway_ready
      retries: 10
      delay: 2
      until: gateway_ready.status == 200
      changed_when: false

    - name: Create isolated finalization home
      ansible.builtin.tempfile:
        state: directory
        prefix: codex-gateway-finalize-
      register: gateway_finalize_home
      changed_when: false

    - name: Verify and finalize prepared cutover
      block:
        - name: Verify activated gateway discovery with fresh Codex model/list
          ansible.builtin.command:
            argv: ["{{ gateway_release_root }}/current/codex-gateway", verify-model-list, --catalog, "{{ gateway_catalog_path }}", --auth-file, "{{ gateway_home }}/.codex/auth.json", --discovery-base-url, "http://127.0.0.1:48766/v1", --codex-binary, "{{ gateway_codex_binary }}"]
          environment:
            CODEX_HOME: "{{ gateway_finalize_home.path }}"
          changed_when: false

        - name: Validate configured Codex catalog load
          ansible.builtin.command:
            argv: ["{{ gateway_codex_binary }}", debug, models]
          register: gateway_codex_catalog_check
          changed_when: false
          no_log: true

        - name: Require Subscription ChatGPT in the configured catalog
          ansible.builtin.assert:
            that: ((gateway_codex_catalog_check.stdout | from_json).models | selectattr('slug', 'equalto', 'subscription-chatgpt/chatgpt') | list | length) == 1

      always:
        - name: Clean isolated finalization home
          ansible.builtin.file:
            path: "{{ gateway_finalize_home.path }}"
            state: absent
          changed_when: false

    - name: Record successful release
      ansible.builtin.copy:
        dest: "{{ gateway_state_root }}/receipt.json"
        mode: '0600'
        content: "{{ {'commit': gateway_pending.commit, 'binary_sha256': gateway_pending.binary_sha256, 'catalog_sha256': gateway_pending.catalog_sha256, 'host': gateway_pending.host, 'account': gateway_pending.account} | to_nice_json }}\n"

    - name: Remove completed recovery transaction
      ansible.builtin.file:
        path: "{{ gateway_pending.transaction_path }}"
        state: absent
      changed_when: false

    - name: Remove completed pending cutover
      ansible.builtin.file:
        path: "{{ gateway_pending_path }}"
        state: absent
      changed_when: false
